name: gossip_chat
description: "Demo app for gossip and gossip_bluey packages"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Gossip packages (path dependencies)
  gossip:
    path: ../../packages/gossip
  gossip_bluey:
    path: ../../packages/gossip_bluey

  # Utilities
  uuid: ^4.0.0
  device_info_plus: ^12.3.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  permission_handler: ^12.0.1
  share_plus: ^10.0.0

  # QR codes
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # Kept aligned with the root workspace's bluey pin (packages/gossip_bluey
  # targets f29ec98's Scanner.scan ScanMode API) — this app isn't a
  # workspace member, so its lock can drift independently if not bumped
  # alongside the root override.
  bluey:
    git:
      url: https://github.com/neutrinographics/bluey.git
      path: bluey
      ref: "f29ec98"
  bluey_platform_interface:
    git:
      url: https://github.com/neutrinographics/bluey.git
      path: bluey_platform_interface
      ref: "f29ec98"
  bluey_android:
    git:
      url: https://github.com/neutrinographics/bluey.git
      path: bluey_android
      ref: "f29ec98"
  bluey_ios:
    git:
      url: https://github.com/neutrinographics/bluey.git
      path: bluey_ios
      ref: "f29ec98"

flutter:
  uses-material-design: true
