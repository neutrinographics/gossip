name: gossip_bluey
description: BLE transport for gossip, built on the bluey library. Supports mesh and star topologies.
version: 0.1.0
repository: https://github.com/neutrinographics/gossip/tree/main/packages/gossip_bluey
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.4
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  gossip:
    path: ../gossip
  bluey:
    git:
      url: https://github.com/neutrinographics/bluey.git
      path: bluey
  meta: ^1.11.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  mocktail: ^1.0.4
  # For PlatformKind in port-impl tests. Version resolved by the
  # workspace dependency_overrides (same git ref as bluey itself).
  bluey_platform_interface:
    git:
      url: https://github.com/neutrinographics/bluey.git
      path: bluey_platform_interface
