name: gossip_workspace
publish_to: none
repository: https://github.com/neutrinographics/gossip

environment:
  sdk: ^3.10.4

workspace:
  - packages/gossip
  - packages/gossip_nearby
  - packages/gossip_bluey

dev_dependencies:
  melos: ^7.4.0

dependency_overrides:
  bluetooth_low_energy_platform_interface:
    path: /Users/joel/git/neutrinographics/bluetooth_low_energy/bluetooth_low_energy_platform_interface
  bluetooth_low_energy_android:
    path: /Users/joel/git/neutrinographics/bluetooth_low_energy/bluetooth_low_energy_android
  bluetooth_low_energy_darwin:
    path: /Users/joel/git/neutrinographics/bluetooth_low_energy/bluetooth_low_energy_darwin
  # Pinned to bluey main tip including I333 (adapter-state invalidation)
  # and the I334/I335 stream-conventions sweep (current-value replay on
  # state streams + onCancel-driven stop on scan). Keeps the workspace
  # lock aligned with the app's lock so `melos run test` /
  # `flutter analyze` in `packages/gossip_bluey` resolve against the
  # bluey API the current gossip_bluey code targets.
  bluey:
    git:
      url: https://github.com/neutrinographics/bluey.git
      path: bluey
      ref: "f29ec98"
  bluey_platform_interface:
    git:
      url: https://github.com/neutrinographics/bluey.git
      path: bluey_platform_interface
      ref: "f29ec98"
  bluey_android:
    git:
      url: https://github.com/neutrinographics/bluey.git
      path: bluey_android
      ref: "f29ec98"
  bluey_ios:
    git:
      url: https://github.com/neutrinographics/bluey.git
      path: bluey_ios
      ref: "f29ec98"

melos:
  scripts:
    analyze:
      run: melos exec --no-depends-on=flutter -- dart analyze . && melos exec --depends-on=flutter -- flutter analyze .
      description: Run static analysis in all packages

    test:
      run: melos exec --no-depends-on=flutter --dir-exists=test -- dart test && melos exec --depends-on=flutter --dir-exists=test -- flutter test
      description: Run tests in all packages

    format:
      run: melos exec -- dart format .
      description: Format all packages

    format:check:
      run: melos exec -- dart format --set-exit-if-changed .
      description: Check formatting in all packages
